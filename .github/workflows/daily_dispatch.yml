name: 多益 25 天金色證書每日雲端推播 (08:00 & 14:00)

on:
  schedule:
    # 早上八點 (台北時間 08:00 = UTC 00:00)
    # 設定前置與間隔備援 cron，徹底規避 GitHub 00:00 UTC 整點隊列大塞車 (3-4小時延遲)
    - cron: '50 23 * * *'  # 07:50 台北 (避開整點尖峰)
    - cron: '55 23 * * *'  # 07:55 台北
    - cron: '0 0 * * *'   # 08:00 台北
    - cron: '5 0 * * *'   # 08:05 台北
    - cron: '15 0 * * *'  # 08:15 台北
    - cron: '30 0 * * *'  # 08:30 台北
    # 下午兩點 (台北時間 14:00 = UTC 06:00)
    - cron: '50 5 * * *'   # 13:50 台北 (避開整點尖峰)
    - cron: '55 5 * * *'   # 13:55 台北
    - cron: '0 6 * * *'   # 14:00 台北
    - cron: '5 6 * * *'   # 14:05 台北
    - cron: '15 6 * * *'  # 14:15 台北
    - cron: '30 6 * * *'  # 14:30 台北
  workflow_dispatch:
    inputs:
      session:
        description: '推播梯次：morning 或 afternoon'
        required: false
        default: ''
      force:
        description: '強制重發 (忽略今日已發送標記)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Taipei
      PYTHONUTF8: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝依賴
        run: pip install requests

      - name: 判定推播梯次並發送純檔案
        run: |
          python3 dispatch_runner.py \
            --session "${{ github.event.inputs.session || 'auto' }}" \
            --cron "${{ github.event.schedule }}" \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}
