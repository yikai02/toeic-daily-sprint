name: Deploy GitHub Pages Study Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 下載專案程式碼
        uses: actions/checkout@v4

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 上傳 docs 靜態網站目錄
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/'

      - name: 發布至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
